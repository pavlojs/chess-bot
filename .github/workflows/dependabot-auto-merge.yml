name: Dependabot auto-merge

# `dev` deliberately has no required status checks — they would block the
# direct pushes this repo relies on. That also means GitHub's native auto-merge
# would merge a Dependabot PR the moment it was opened, without reading CI.
# So the gate lives here: this re-reads every check on the PR head and merges
# only when all of them have finished and passed.
#
# It listens to every workflow that runs on a PR, because whichever one
# finishes last is the one that can see a complete set of results. The earlier
# ones find work still running and stop without merging — which is a normal
# outcome, not a failure, so those runs end green.

on:
  workflow_run:
    workflows: [Tests, Security, CodeQL]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Resolve the pull request
        id: pr
        run: |
          set -euo pipefail
          NUM=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state=="open" and .base.ref=="dev")] | first | .number // empty')
          if [ -z "$NUM" ]; then
            echo "No open PR against dev for $HEAD_SHA."
            exit 0
          fi
          AUTHOR=$(gh pr view "$NUM" --repo "$REPO" --json author --jq .author.login)
          if [ "$AUTHOR" != "app/dependabot" ] && [ "$AUTHOR" != "dependabot" ]; then
            echo "PR #$NUM is authored by $AUTHOR, not Dependabot."
            exit 0
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Classify the bump
        id: bump
        if: steps.pr.outputs.number
        run: |
          set -euo pipefail
          TITLE=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$REPO" --json title --jq .title)
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          # Grouped PRs are configured for minor+patch only, so they carry no
          # "from X to Y" and are safe by construction.
          if [[ "$TITLE" =~ from\ ([0-9]+)[^\ ]*\ to\ ([0-9]+) ]] \
             && [ "${BASH_REMATCH[1]}" != "${BASH_REMATCH[2]}" ]; then
            echo "major=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TITLE is a major bump. Leaving it for review."
          else
            echo "major=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read every check on the head commit
        id: checks
        if: steps.pr.outputs.number && steps.bump.outputs.major == 'false'
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
            --jq '[.check_runs[] | select(.name != "auto-merge")]')

          PENDING=$(jq -r '[.[] | select(.status != "completed")] | length' <<<"$RUNS")
          if [ "$PENDING" -gt 0 ]; then
            echo "$PENDING check(s) still running; the workflow that finishes last will merge."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BAD=$(jq -r '[.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | .name] | join(", ")' <<<"$RUNS")
          if [ -n "$BAD" ]; then
            echo "::warning::Not merging — these checks did not pass: $BAD"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.checks.outputs.ready == 'true'
        run: |
          set -euo pipefail
          N="${{ steps.pr.outputs.number }}"
          gh pr merge "$N" --repo "$REPO" --squash \
            --subject "${{ steps.bump.outputs.title }} (#$N)" --body "" --delete-branch
