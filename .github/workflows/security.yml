name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 9 * * 1'  # Weekly, Monday 09:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Audits the pinned sets against PyPI advisories. requirements-dev.txt
      # includes requirements.txt, so one pass covers what ships and what tests.
      - name: Audit dependencies
        run: pip-audit --requirement requirements-dev.txt --strict

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t chess-bot:ci .

      # Filed as alerts: HIGH and CRITICAL vulnerabilities that a newer package
      # fixes. Those are the ones an update of the base image can close, and
      # Dependabot proposes that update.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: chess-bot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true

      # For the record, in this job's log only: everything the scanner knows
      # of in the image, including what Debian has not released a fix for.
      - name: List vulnerabilities that have no fix yet
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: chess-bot:ci
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
