name: Update Stockfish

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

concurrency:
  group: update-stockfish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stockfish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Resolve latest Stockfish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(gh release view --repo official-stockfish/Stockfish --json tagName --jq .tagName)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::Could not resolve the latest Stockfish tag."
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"

      - name: Record the version if it changed
        run: |
          set -euo pipefail
          if [ -f last_version.txt ] && [ "$(cat last_version.txt)" = "$LATEST_TAG" ]; then
            echo "Stockfish is already recorded as $LATEST_TAG"
            echo "UPDATE_NEEDED=false" >> "$GITHUB_ENV"
          else
            echo "New Stockfish version available: $LATEST_TAG"
            echo "UPDATE_NEEDED=true" >> "$GITHUB_ENV"
            echo "$LATEST_TAG" > last_version.txt
          fi

      # last_version.txt is a marker: the Dockerfile always pulls the latest
      # release at build time, so this commit's job is to make version drift
      # visible in history and to carry a rebuild through the next promotion.
      - name: Commit to dev
        if: env.UPDATE_NEEDED == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_version.txt
          git commit -m "chore: record Stockfish $LATEST_TAG"
          git push origin HEAD:dev
