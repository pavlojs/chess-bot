name: Update Stockfish

# The image installs one named Stockfish release, checked against its SHA-256.
# Both values live in the Dockerfile. When Stockfish publishes a new release,
# this workflow moves them on dev; the engine reaches the published image with
# the next promotion, after CI has built and checked an image with it.

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

concurrency:
  group: update-stockfish
  cancel-in-progress: false

permissions:
  contents: write
  # Needed to start CI on the commit this workflow pushes.
  actions: write

jobs:
  update-stockfish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ASSET: stockfish-linux-x86-64-universal.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Resolve the latest Stockfish release
        run: |
          set -euo pipefail
          RELEASE=$(gh api repos/official-stockfish/Stockfish/releases/latest)
          TAG=$(jq -r '.tag_name' <<<"$RELEASE")
          SHA256=$(jq -r --arg name "$ASSET" '.assets[] | select(.name == $name) | .digest' <<<"$RELEASE" | sed 's/^sha256://')

          # Both values are written into the Dockerfile, so they have to look
          # exactly like a release tag and a SHA-256 and nothing else.
          if ! [[ "$TAG" =~ ^sf_[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Unexpected release tag: '$TAG'"
            exit 1
          fi
          if ! [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The release publishes no SHA-256 for $ASSET"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Point the Dockerfile at it
        run: |
          set -euo pipefail
          sed -i -E \
            -e "s|^ARG STOCKFISH_TAG=.*|ARG STOCKFISH_TAG=${TAG}|" \
            -e "s|^ARG STOCKFISH_SHA256=.*|ARG STOCKFISH_SHA256=${SHA256}|" \
            Dockerfile
          grep -q "^ARG STOCKFISH_TAG=${TAG}$" Dockerfile
          grep -q "^ARG STOCKFISH_SHA256=${SHA256}$" Dockerfile

          if git diff --quiet -- Dockerfile; then
            echo "The Dockerfile already installs Stockfish $TAG"
            echo "UPDATED=false" >> "$GITHUB_ENV"
          else
            echo "UPDATED=true" >> "$GITHUB_ENV"
          fi

      - name: Commit to dev
        if: env.UPDATED == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git commit -m "build: install Stockfish $TAG"
          git push origin HEAD:dev

      # A push made with GITHUB_TOKEN starts no workflow, and promotion needs a
      # green CI run on the head of dev, so CI is started by hand.
      - name: Run CI on the new commit
        if: env.UPDATED == 'true'
        run: gh workflow run ci.yml --ref dev
