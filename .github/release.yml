# Groups pull requests in auto-generated release notes, used by the optional
# tag step of the promote workflow.
#
# Note: most work is pushed straight to dev without a PR, so generated notes
# only cover issue-driven and outside contributions. Everything else shows up
# as plain commits.

changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "🚨 Breaking Changes"
      labels:
        - breaking
    - title: "✨ Features"
      labels:
        - enhancement
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🔒 Security"
      labels:
        - security
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "📖 Documentation"
      labels:
        - documentation
        - docs
    - title: "Other Changes"
      labels:
        - "*"
